<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tension Lab · ผู้เรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,400;0,500;0,600;0,800;1,800&display=swap">
<style>
:root{--bg:#f2f2ef;--panel:#ffffff;--line:#e2e2de;--fg:#1c1d1f;--muted:#5d5f63;--yellow:#ffe500;--ink:#121210;--accent-t:#7d6000;--ok:#1f7a3d;--bad:#c2331f;--font:"Prompt","Leelawadee UI","Thonburi",system-ui,sans-serif;color-scheme:light;
  --fs-xs:12px;--fs-s:14px;--fs-m:16px;--fs-l:20px;--fs-xl:24px;--fs-2xl:clamp(32px,6vw,48px);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;--sp-8:64px}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs-m);line-height:1.6;padding:var(--sp-4) max(var(--sp-4),env(safe-area-inset-left)) calc(var(--sp-5) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--sp-4);max-width:560px;margin-inline:auto}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.logo{font-weight:800;font-style:italic;font-size:var(--fs-l)}.logo span{background:var(--yellow);color:var(--ink);padding:0 .2em;border-radius:4px}
.me{font-size:var(--fs-s);line-height:1.4;color:var(--muted);text-align:right}
.me b{color:var(--fg)}
.k{font-size:var(--fs-s);color:var(--muted)}
h1{font-size:var(--fs-xl);margin:0;line-height:1.3}
.field{display:flex;flex-direction:column;gap:var(--sp-2)}
.field input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:var(--sp-3);font-size:var(--fs-m);line-height:1.6;width:100%}
.code-in{font-size:var(--fs-2xl)!important;line-height:1.3!important;letter-spacing:.2em;font-weight:800;text-align:center}
textarea{min-height:150px;resize:vertical}
.cta{background:var(--yellow);color:var(--ink);border:none;border-radius:999px;padding:var(--sp-4) var(--sp-5);font-size:var(--fs-m);line-height:1.4;font-weight:600;width:100%}
.cta:disabled{opacity:.4}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:var(--sp-3) var(--sp-4);font-size:var(--fs-m);line-height:1.4;width:100%}
.box{background:var(--panel);border-radius:18px;padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
.center{text-align:center;align-items:center}
.big{font-size:var(--fs-2xl);font-weight:800;color:var(--accent-t);line-height:1.1}
.count{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent-t);font-size:var(--fs-xl)}
.count.low{color:var(--bad)}
.qp{font-size:var(--fs-l);font-weight:600;margin:0;line-height:1.45}
.o4{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-3);align-items:center;border:none;border-radius:16px;padding:var(--sp-4);color:#fff;font-size:var(--fs-m);font-weight:600;text-align:left;line-height:1.35;width:100%}
.o4.c0{background:#c73828}.o4.c1{background:#2969d1}.o4.c2{background:#856907}.o4.c3{background:#207b4b}
.o4 .sh{font-size:var(--fs-l)}
.o4:disabled{opacity:.3}.o4.sel{opacity:1;outline:3px solid var(--fg);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:var(--sp-3)}
.prod{font-size:var(--fs-xl);font-weight:800;line-height:1.3}
.who b,.q em{color:var(--accent-t);font-style:normal;font-weight:600}
.pair{display:flex;flex-direction:column;gap:var(--sp-1);border-top:1px solid var(--line);padding-top:var(--sp-3)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}.dot.a{background:var(--yellow)}.dot.b{background:var(--fg)}
.ex{color:var(--muted);font-size:var(--fs-s)}
.chk{display:flex;gap:var(--sp-2);align-items:flex-start;font-size:var(--fs-s);color:var(--muted)}
.chk input{width:20px;height:20px;accent-color:var(--yellow);margin-top:2px;flex:none}
.vcard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:var(--sp-4);text-align:left;font-size:var(--fs-m);line-height:1.6;width:100%;white-space:pre-wrap;word-break:break-word;display:flex;flex-direction:column;gap:var(--sp-2)}
.vcard.on{border-color:var(--fg);background:color-mix(in srgb,var(--yellow) 25%,var(--panel))}
.vcard.mine{opacity:.55;cursor:default}
.vcard small{color:var(--muted);font-size:var(--fs-xs)}
.vcard.on small{color:var(--accent-t)}
.sticky{position:sticky;bottom:var(--sp-2)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.err{color:var(--bad);font-size:var(--fs-s);margin:0}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0;font-size:var(--fs-s);min-height:44px}
.tier{margin-top:var(--sp-2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-2)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:var(--sp-2) var(--sp-3);font-size:var(--fs-s);line-height:1.4;min-height:44px}
.chip small{display:block;font-size:var(--fs-xs);color:var(--muted);font-weight:400}
.chip.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow);font-weight:600}
.tag{display:inline-block;background:var(--yellow);color:var(--ink);border-radius:999px;padding:var(--sp-1) var(--sp-3);font-size:var(--fs-s);font-weight:600}
button,input,textarea{line-height:1.6;letter-spacing:normal;font-kerning:normal}.me{line-height:1.6}
</style>
</head><body>
<header class="top"><div class="logo">TENSION <span>LAB</span></div><div class="me" id="me"></div></header>
<main id="app" aria-live="polite"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="data.js"></script>
<script>
/* Phone side: join with a nickname, then mirror whatever phase the host broadcasts. */
const $=id=>document.getElementById(id);
const SHAPE=["▲","◆","●","■"];
const PK="tensionlab.player1";
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rid=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>"abcdefghijklmnopqrstuvwxyz0123456789"[b%36]).join("");
let me=ls.get(PK,null);if(!me||!me.pid)me={pid:rid(12),n:"",code:""};
const urlCode=(new URLSearchParams(location.search).get("r")||"").replace(/\D/g,"").slice(0,4);
let sb=null,ch=null,st=null,stAt=0,joined=false,helloT=null,cdT=null,draft={};
const fmt=s=>s>=60?String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"):String(s);
const K=s=>`tl.${st?st.code:me.code}.${s}`;

function join(code,name){
  me.code=code;me.n=name;ls.set(PK,me);joined=true;st=null;render(true);
  if(!window.supabase){renderErr("โหลดระบบไม่สำเร็จ ลองรีเฟรชหน้า");return}
  sb=sb||window.supabase.createClient(SB.url,SB.key);
  if(ch)try{sb.removeChannel(ch)}catch(e){}
  ch=sb.channel(CHAN(code),{config:{broadcast:{self:false}}});
  ch.on("broadcast",{event:"st"},m=>{st=m.payload;stAt=Date.now();render()})
    .subscribe(s=>{if(s==="SUBSCRIBED")hello()});
  clearInterval(helloT);helloT=setInterval(()=>{if(!st||Date.now()-stAt>6000||!st.sc[me.pid])hello()},4000);
}
function send(ev,p){if(ch)ch.send({type:"broadcast",event:ev,payload:Object.assign({pid:me.pid},p)})}
function hello(){send("hello",{n:me.n})}
function leave(){if(ch)try{sb.removeChannel(ch)}catch(e){}ch=null;joined=false;st=null;clearInterval(helloT);render(true)}

function header(){const r=st&&st.sc&&st.sc[me.pid];
  $("me").innerHTML=joined?`<b>${esc(me.n)}</b><br>${r?`${r[0]} คะแนน · อันดับ ${r[1]}/${st.np}`:"กำลังเข้าห้อง…"}`:""}
function renderErr(t){$("app").innerHTML=`<div class="box"><p class="err">${esc(t)}</p></div>`}

/* countdown driven by "left" ms from the host, re-anchored on every broadcast */
function startCd(left){clearInterval(cdT);const end=stAt+left;const paint=()=>{const e=$("cd");if(!e){clearInterval(cdT);return}const s=Math.max(0,Math.ceil((end-Date.now())/1000));e.textContent=fmt(s);e.classList.toggle("low",s<=5)};paint();cdT=setInterval(paint,250)}

/* Re-render only when what this phone shows actually changes, so typing is never interrupted by heartbeats. */
let lastSig=null;
function sig(){if(!joined)return"join";if(!st||!st.sc[me.pid])return"wait";const ph=st.ph,c=st.cr;
  if(ph==="quiz"||ph==="quizReveal")return ph+st.q.i+":"+st.q.p+":"+st.q.done.includes(me.pid);
  if(ph==="pick"||ph==="pickReveal")return ph+st.pk.r+":"+st.pk.done.includes(me.pid);
  if(ph==="create")return ph+c.r+c.closed+c.done.includes(me.pid)+(draft.r===c.r&&!!draft.edit);
  if(ph==="vote")return ph+c.r+c.list.map(x=>x.aid+x.t.length).join()+ls.get(K("vote"+c.r),[]).join();
  return ph+JSON.stringify(c&&c.cnt||"")+(c&&c.judge)+JSON.stringify(st.fin||"")+JSON.stringify(st.sc[me.pid])}
function render(force){
  header();const A=$("app");const s=sig();
  if(!force&&s===lastSig){if($("cd")){const left=st.ph==="quiz"?st.q.left:st.cr&&st.cr.left;if(left!=null)startCd(left)}return}
  lastSig=s;
  if(!joined){
    A.innerHTML=`<h1>เข้าร่วมเกม</h1>
    <div class="field"><label class="k" for="c">รหัสห้อง 4 หลัก</label><input id="c" class="code-in" inputmode="numeric" maxlength="4" value="${esc(urlCode||me.code||"")}" autocomplete="off"></div>
    <div class="field"><label class="k" for="n">ชื่อเล่นที่จะโชว์บนจอ (ไม่ต้องใช้ชื่อจริง)</label><input id="n" maxlength="20" value="${esc(me.n||"")}" autocomplete="nickname"></div>
    <p class="err" id="e"></p><button class="cta" id="go">เข้าร่วม</button>`;
    $("go").onclick=()=>{const c=$("c").value.replace(/\D/g,""),n=$("n").value.trim();if(c.length!==4){$("e").textContent="ใส่รหัสห้อง 4 หลัก";return}if(!n){$("e").textContent="ตั้งชื่อเล่นก่อนนะ";return}join(c,n)};
    return}
  if(!st||!st.sc[me.pid]){A.innerHTML=`<div class="box center"><p class="k">กำลังเข้าห้อง ${esc(me.code)}…</p><p>ถ้ารอนานเกินไป เช็ครหัสห้องกับจออีกครั้ง</p><button class="ghost" id="lv">เปลี่ยนรหัสห้องหรือชื่อ</button></div>`;$("lv").onclick=leave;return}
  const ph=st.ph;
  if(ph==="lobby"){A.innerHTML=`<div class="box center"><div class="big">✓</div><h1>เข้าห้องแล้ว</h1><p class="k">ดูชื่อ “${esc(me.n)}” บนจอ แล้วรอผู้สอนเริ่มเกม</p></div><button class="link" id="lv">เปลี่ยนชื่อ</button>`;$("lv").onclick=leave;return}
  if(ph==="quiz"||ph==="quizReveal")return renderQuiz(A);
  if(ph==="pick"||ph==="pickReveal")return renderPick(A);
  if(ph==="create")return st.cr.pk?renderCreatePk(A):renderCreate(A);
  if(ph==="vote")return renderVote(A);
  if(ph==="voteReveal")return renderVoteRev(A);
  if(ph==="final")return renderFinal(A);
}

function renderQuiz(A){
  const q=st.q,key=K("q"+q.i+":"+q.p.length),pick=ls.get(key,null),done=pick!=null||q.done.includes(me.pid);
  if(st.ph==="quiz"){
    A.innerHTML=`<div class="top"><span class="k">ข้อ ${q.i+1}/${q.n}</span><span class="count" id="cd"></span></div>
      <p class="qp">${esc(q.p)}</p>
      <div class="list">${q.o.map((o,i)=>`<button class="o4 c${i}${pick===i?" sel":""}" data-i="${i}" ${done?"disabled":""}><span class="sh">${SHAPE[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      ${done?`<p class="k" style="text-align:center">ส่งคำตอบแล้ว รอเฉลยบนจอ</p>`:""}`;
    startCd(q.left);
    A.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;ls.set(key,i);send("ans",{qi:q.i,c:i});render(true)});
  }else{
    const g=(q.gain||{})[me.pid];const right=g>0;
    A.innerHTML=`<div class="box center"><span class="k">ข้อ ${q.i+1}/${q.n}</span>
      <div class="big ${right?"ok":pick!=null?"bad":""}">${right?"ถูก! +"+g:pick!=null?"ยังไม่ใช่":"ไม่ได้ตอบ"}</div>
      <p class="k">คำตอบที่ถูก</p><div class="o4 c${q.c}"><span class="sh">${SHAPE[q.c]}</span><span>${esc(q.o[q.c])}</span></div></div>
      <p class="k" style="text-align:center">รอข้อต่อไปจากผู้สอน</p>`;
  }
}

/* Pyramid: tap 3 elements, send once; after the reveal, see how many picked the same */
function renderPick(A){
  const k=st.pk,key=K("pk"+k.r);if(draft.pr!==k.r){draft.pr=k.r;draft.sel=[];draft.sent=0}
  const mine=ls.get(key,null)||(draft.sent?draft.sel:null),done=!!mine||k.done.includes(me.pid);
  const top=`<div class="box"><span class="k">โจทย์</span><div class="prod">${esc(k.p)}</div><div class="who">สำหรับ <b>${esc(k.w)}</b></div></div>`;
  if(st.ph==="pick"&&!done){const s=draft.sel;
    A.innerHTML=`<div class="top"><span class="k">เลือก 3 ช่องที่คนกลุ่มนี้แคร์ที่สุด</span><span class="count" id="cd"></span></div>${top}
      ${EOVL.map((t,l)=>`<div class="tier"><span class="k">${EOVLE[l]} · ${t}</span><div class="chips">${EOV.map((e,i)=>e[0]===l?`<button class="chip${s.includes(i)?" on":""}" data-e="${i}" aria-pressed="${s.includes(i)}">${eovH(i)}</button>`:"").join("")}</div></div>`).join("")}
      <p class="err" id="e"></p><div class="sticky"><button class="cta" id="go">ส่งคำตอบ (${s.length}/3)</button></div>`;
    startCd(k.left);
    A.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const i=+b.dataset.e;if(s.includes(i))s.splice(s.indexOf(i),1);else if(s.length<3)s.push(i);else{$("e").textContent="เลือกได้ 3 ช่อง แตะช่องเดิมเพื่อเอาออก";return}render(true)});
    $("go").onclick=()=>{if(s.length<3){$("e").textContent="เลือกให้ครบ 3 ช่องก่อนส่ง";return}draft.sent=1;ls.set(key,s.slice());send("pick",{r:k.r,ids:s.slice()});render(true)};
    return}
  if(st.ph==="pick"){A.innerHTML=`${top}<div class="box center"><h1>ส่งแล้ว</h1>${mine?`<p style="margin:0">${mine.map(i=>esc(EOV[i][1])).join(" · ")}</p>`:""}<p class="k">รอดูพีระมิดบนจอ</p></div>`;return}
  A.innerHTML=`${top}<div class="box"><span class="k">ช่องที่คุณเลือก · มีคนเลือกเหมือนกันกี่คน</span>${mine?mine.map(i=>`<div class="top"><span>${esc(EOV[i][1])}</span><b class="count">${k.cnt[i]}</b></div>`).join(""):`<p class="k" style="margin:0">รอบนี้ไม่ได้เลือก</p>`}</div>
    <p class="k" style="text-align:center">ดูพีระมิดทั้งห้องบนจอ</p>`;
}

function brief(c){if(c.pk)return`<div class="box"><span class="k">โจทย์รอบ ${c.r}</span><div class="prod">${esc(c.p)}</div><div class="who">สำหรับ <b>${esc(c.w)}</b></div><p class="q" style="margin:0">เขียน VP จากช่องที่เลือก</p></div>`;
  const a=V[c.a],b=V[opp(c.a)];
  return`<div class="box"><span class="k">โจทย์รอบ ${c.r}</span><div class="prod">${esc(c.p)}</div><div class="who">สำหรับ <b>${esc(c.w)}</b></div>
  <div class="pair"><div><span class="dot a"></span>ให้คุณค่ากับ <b>${a.vn}</b></div><div class="ex">เช่น ${a.W.slice(0,3).map(esc).join(" · ")}</div>
  <div><span class="dot b"></span>แต่ก็ติดที่ <b>${b.pull}</b></div><div class="ex">เช่น ${b.P.slice(0,3).map(esc).join(" · ")}</div></div>
  <p class="q" style="margin:0"><em>${esc(c.p)}</em> ควรสื่อสารในแง่ไหน เพื่อช่วย<em>${esc(c.w)}</em>ที่ลังเลนี้?</p></div>`}

/* Pyramid VP: pick one of my 3 elements, fill the 3 parts of the formula; sent as one text so voting stays the same */
let pd={};
const PKF=[["who","ใครแคร์","คนกลุ่มไหน ในสถานการณ์ไหน"],["give","เราให้อะไร","สิ่งที่เขาได้จากเรา"],["why","ทำไมต้องเป็นเรา","เหตุผลที่เชื่อได้ว่าเราทำได้"]];
function renderCreatePk(A){
  const c=st.cr,key=K("sub"+c.r),mine=ls.get(key,null)||(pd.r===c.r?pd.m:null),sent=mine&&c.done.includes(me.pid);
  if(pd.r!==c.r)pd={r:c.r,edit:false,f:mine&&mine.f?{...mine.f}:{},show:mine?mine.show:true};
  const picks=ls.get(K("pk"+c.r),null)||(draft.pr===c.r&&draft.sent?draft.sel:null)||c.top||[],f=pd.f;
  if(c.closed){A.innerHTML=`${brief(c)}<div class="box center"><h1>หมดเวลาส่งคำตอบ</h1><p class="k">${mine?"ส่งแล้ว รอโหวตบนจอ":"รอบนี้ไม่ได้ส่ง ไม่เป็นไร ยังโหวตได้"}</p></div>`;return}
  if(sent&&!pd.edit){
    A.innerHTML=`<div class="top"><span class="k">เหลือเวลา</span><span class="count" id="cd"></span></div>${brief(c)}
    <div class="box"><span class="tag">ส่งแล้ว +100</span><p style="margin:0;white-space:pre-wrap">${esc(mine.text)}</p><button class="ghost" id="ed">แก้คำตอบ</button></div>`;
    startCd(c.left);$("ed").onclick=()=>{pd.edit=true;pd.f={...(mine.f||{})};render(true)};return}
  if(f.el==null&&picks.length)f.el=picks[0];
  A.innerHTML=`<div class="top"><span class="k">เหลือเวลา</span><span class="count" id="cd"></span></div>${brief(c)}
    ${picks.length?`<div class="field"><span class="k">ใช้ช่องไหนเขียน</span><div class="chips">${picks.map(i=>`<button class="chip${f.el===i?" on":""}" data-el="${i}" aria-pressed="${f.el===i}">${eovH(i)}</button>`).join("")}</div></div>`:""}
    ${PKF.map(([k,l,ph])=>`<div class="field"><label class="k" for="f-${k}">${l}</label><input id="f-${k}" maxlength="100" placeholder="${ph}" value="${esc(f[k]||"")}"></div>`).join("")}
    <label class="chk"><input type="checkbox" id="sh" ${pd.show?"checked":""}> ถ้าคำตอบติดท็อปหรือได้ Judge’s pick โชว์ชื่อเล่นของฉันได้</label>
    <p class="err" id="e"></p><button class="cta sticky" id="sd">${mine?"ส่งคำตอบที่แก้":"ส่ง VP"}</button>`;
  startCd(c.left);
  PKF.forEach(([k])=>$("f-"+k).oninput=e=>{f[k]=e.target.value});
  A.querySelectorAll("[data-el]").forEach(b=>b.onclick=()=>{f.el=+b.dataset.el;render(true)});
  $("sh").onchange=()=>{pd.show=$("sh").checked};
  $("sd").onclick=()=>{const v=PKF.map(([k])=>(f[k]||"").trim());if(v.some(x=>!x)){$("e").textContent="กรอกให้ครบ 3 ช่องก่อนส่ง";return}
    const text=(f.el!=null?EOV[f.el][1]+"\n":"")+PKF.map(([k,l],i)=>l+": "+v[i]).join("\n");
    const aid=mine?mine.aid:rid(10),m={aid,text,show:pd.show,f:{...f}};ls.set(key,m);pd.m=m;pd.edit=false;send("sub",{r:c.r,aid,text,show:m.show});
    if(!c.done.includes(me.pid))c.done.push(me.pid);render(true)};
}

function renderCreate(A){
  const c=st.cr,key=K("sub"+c.r),mine=ls.get(key,null),sent=mine&&c.done.includes(me.pid);
  const editing=draft.r===c.r&&draft.edit;
  if(c.closed){A.innerHTML=`${brief(c)}<div class="box center"><h1>หมดเวลาส่งคำตอบ</h1><p class="k">${mine?"ส่งแล้ว รอโหวตบนจอ":"รอบนี้ไม่ได้ส่ง ไม่เป็นไร ยังโหวตได้"}</p></div>`;return}
  if(sent&&!editing){
    A.innerHTML=`<div class="top"><span class="k">เหลือเวลา</span><span class="count" id="cd"></span></div>${brief(c)}
    <div class="box"><span class="tag">ส่งแล้ว +100</span><p style="margin:0;white-space:pre-wrap">${esc(mine.text)}</p><button class="ghost" id="ed">แก้คำตอบ</button></div>`;
    startCd(c.left);$("ed").onclick=()=>{draft={r:c.r,edit:true,text:mine.text,show:mine.show};render(true)};return}
  const keep=$("ta")?$("ta").value:null;
  const text=keep!=null&&draft.r===c.r?keep:(draft.r===c.r&&draft.text!=null?draft.text:(mine?mine.text:""));
  const show=draft.r===c.r&&draft.show!=null?draft.show:(mine?mine.show:true);
  A.innerHTML=`<div class="top"><span class="k">เหลือเวลา</span><span class="count" id="cd"></span></div>${brief(c)}
    <div class="field"><label class="k" for="ta">คำตอบของคุณ (ไม่โชว์ชื่อบนจอตอนโหวต)</label><textarea id="ta" maxlength="280" placeholder="เช่น ควรพูดว่า…">${esc(text)}</textarea><span class="k" id="ln">${text.length}/280</span></div>
    <label class="chk"><input type="checkbox" id="sh" ${show?"checked":""}> ถ้าคำตอบติดท็อปหรือได้ Judge’s pick โชว์ชื่อเล่นของฉันได้</label>
    <button class="cta sticky" id="sd">${mine?"ส่งคำตอบที่แก้":"ส่งคำตอบ"}</button>`;
  startCd(c.left);
  const ta=$("ta");ta.oninput=()=>{draft={r:c.r,edit:editing,text:ta.value,show:$("sh").checked};$("ln").textContent=ta.value.length+"/280"};
  $("sh").onchange=()=>{draft={r:c.r,edit:editing,text:ta.value,show:$("sh").checked}};
  $("sd").onclick=()=>{const t=ta.value.trim();if(!t){ta.focus();return}const aid=mine?mine.aid:rid(10);const m={aid,text:t,show:$("sh").checked};ls.set(key,m);draft={};send("sub",{r:c.r,aid,text:t,show:m.show});
    // show as sent immediately; the host broadcast confirms it
    if(!c.done.includes(me.pid))c.done.push(me.pid);render(true)};
}

function renderVote(A){
  const c=st.cr,mine=ls.get(K("sub"+c.r),null),vk=K("vote"+c.r);let sel=ls.get(vk,[]).filter(a=>c.list.some(x=>x.aid===a));
  A.innerHTML=`<div class="box"><span class="k">โหวต · เลือกได้ 2 คำตอบที่ชอบ</span><p style="margin:0"><b>${esc(c.p)}</b> สำหรับ ${esc(c.w)}</p><p class="k" style="margin:0">เลือกแล้ว ${sel.length}/2 · เปลี่ยนได้จนผู้สอนปิดโหวต</p></div>
  <div class="list">${c.list.map((x,i)=>{const own=mine&&mine.aid===x.aid;return`<button class="vcard${own?" mine":""}${sel.includes(x.aid)?" on":""}" data-a="${x.aid}" ${own?"disabled":""}><small>${own?"คำตอบของคุณ":"#"+(i+1)+(sel.includes(x.aid)?" · เลือกแล้ว":"")}</small>${esc(x.t)}</button>`}).join("")||`<p class="k">ยังไม่มีคำตอบ</p>`}</div>`;
  A.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(sel.includes(a))sel=sel.filter(x=>x!==a);else{sel.push(a);if(sel.length>2)sel.shift()}ls.set(vk,sel);send("vote",{r:c.r,aids:sel});render(true)});
}
function renderVoteRev(A){
  const c=st.cr,mine=ls.get(K("sub"+c.r),null);const n=mine?(c.cnt[mine.aid]||0):0,j=mine&&c.judge===mine.aid;
  A.innerHTML=`<div class="box center"><span class="k">ผลโหวตรอบ ${c.r}</span>${mine?`<div class="big">${n} โหวต</div><p style="margin:0">ได้ +${n*100} คะแนนจากเพื่อน</p>${j?`<p class="tag">★ Judge’s pick +300</p>`:""}`:`<h1>ดูผลบนจอได้เลย</h1><p class="k">รอบหน้าลองส่งคำตอบ ได้ +100 ทันที</p>`}</div>`;
}
function renderFinal(A){
  const r=st.sc[me.pid],f=st.fin||{top:[],judge:[]};const aw=[];
  if(f.top.includes(me.pid))aw.push(["คะแนนรวมอันดับ "+r[1],""]);
  if((f.fav||[]).includes(me.pid))aw.push(["ขวัญใจเพื่อน","ได้โหวตมากที่สุด"]);
  const jn=f.judge.filter(x=>x===me.pid).length;if(jn)aw.push(["Judge’s pick",jn>1?jn+" ครั้ง":""]);
  A.innerHTML=`<div class="box center"><span class="k">สรุปผล</span><div class="big">อันดับ ${r[1]}</div><p style="margin:0">${r[0]} คะแนน จาก ${st.np} คน</p>
  ${aw.map(a=>`<p class="tag">🏆 ${a[0]}${a[1]?" · "+a[1]:""}</p>`).join("")}</div><p class="k" style="text-align:center">ขอบคุณที่เล่นด้วยกัน</p>`;
}

if(me.code&&me.n&&(!urlCode||urlCode===me.code))join(me.code,me.n);else render();
</script>
</body></html>
